<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Windowed Fullscreen - Options</title>
    <style>
      :root {
        color-scheme: dark light;

        /* Dark theater palette — warm charcoal base with amber glow. */
        --wfs-bg: #1a1a1e;
        --wfs-surface: #242428;
        --wfs-elevated: #2c2c31;
        --wfs-text: #f0ece6;
        --wfs-muted: #9e9a93;
        --wfs-border: rgba(255, 255, 255, 0.07);

        /* Warm amber accent. */
        --wfs-accent: #e8a838;
        --wfs-accent-hover: #f0b848;
        --wfs-accent-dim: rgba(232, 168, 56, 0.12);
        --wfs-accent-dim-hover: rgba(232, 168, 56, 0.18);
        --wfs-on: #6dd69c;
        --wfs-on-bg: rgba(109, 214, 156, 0.1);
        --wfs-danger: #f07068;
        --wfs-danger-bg: rgba(240, 112, 104, 0.1);

        --wfs-ring: 0 0 0 2px var(--wfs-bg), 0 0 0 4px rgba(232, 168, 56, 0.5);
        --wfs-glow: 0 4px 24px rgba(232, 168, 56, 0.06);

        --wfs-font: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --wfs-bg: #faf8f5;
          --wfs-surface: #ffffff;
          --wfs-elevated: #ffffff;
          --wfs-text: #1c1917;
          --wfs-muted: #78716c;
          --wfs-border: rgba(0, 0, 0, 0.08);

          --wfs-accent: #c47f0a;
          --wfs-accent-hover: #a86d08;
          --wfs-accent-dim: rgba(196, 127, 10, 0.08);
          --wfs-accent-dim-hover: rgba(196, 127, 10, 0.14);
          --wfs-on: #16803c;
          --wfs-on-bg: rgba(22, 128, 60, 0.08);
          --wfs-danger: #dc2626;
          --wfs-danger-bg: rgba(220, 38, 38, 0.06);

          --wfs-ring: 0 0 0 2px var(--wfs-bg), 0 0 0 4px rgba(196, 127, 10, 0.4);
          --wfs-glow: 0 4px 30px rgba(196, 127, 10, 0.04);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        font-family: var(--wfs-font);
        font-size: 14px;
        line-height: 1.55;
        color: var(--wfs-text);
        background: var(--wfs-bg);
        padding: 48px 20px;
        -webkit-font-smoothing: antialiased;
      }

      #app {
        max-width: 880px;
        margin: 0 auto;
        padding: 32px 36px 40px;
        background: var(--wfs-surface);
        border: 1px solid var(--wfs-border);
        border-radius: 16px;
        box-shadow: var(--wfs-glow);
      }

      #app h1 {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--wfs-accent);
        margin-bottom: 8px;
      }

      #app section {
        margin-top: 28px;
        padding-top: 24px;
        border-top: 1px solid var(--wfs-border);
      }

      #app section:empty,
      #app [data-wfs-prompt-host]:empty {
        display: none !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
      }

      #app h2 {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--wfs-muted);
        margin-bottom: 12px;
      }

      #app label {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        cursor: pointer;
        padding: 8px 10px;
        margin: -8px -10px;
        border-radius: 10px;
        transition: background 140ms ease;
      }

      #app label:hover {
        background: var(--wfs-accent-dim);
      }

      #app input[type="checkbox"] {
        margin-top: 3px;
        width: 16px;
        height: 16px;
        accent-color: var(--wfs-accent);
        cursor: pointer;
        flex: none;
      }

      #app input[type="checkbox"]:focus-visible {
        outline: none;
        box-shadow: var(--wfs-ring);
        border-radius: 4px;
      }

      #app a {
        color: var(--wfs-accent);
        text-decoration: none;
        font-weight: 600;
        padding: 4px 8px;
        margin: -4px -8px;
        border-radius: 6px;
        transition: background 140ms ease, color 140ms ease;
      }

      #app a:hover {
        background: var(--wfs-accent-dim);
        color: var(--wfs-accent-hover);
      }

      #app a:focus-visible {
        outline: none;
        box-shadow: var(--wfs-ring);
      }

      #app p {
        margin: 8px 0 0;
        font-size: 13px;
        color: var(--wfs-muted);
        max-width: 58ch;
      }

      /* --- Feedback Toast (Floating, Fixed, Always Visible) ----------------- */
      [data-wfs-status],
      [data-wfs-error] {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99999;
        pointer-events: none;
        display: none;
        font-size: 13px;
        line-height: 1.4;
        font-weight: 600;
        border-radius: 10px;
        box-shadow: 0 12px 30px -4px rgba(0, 0, 0, 0.7), 0 4px 12px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        text-align: center;
        margin: 0;
        max-width: 480px;
        width: calc(100% - 48px);
        animation: wfsOptionsToastFloat 220ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      [data-wfs-status]:not(:empty),
      [data-wfs-error]:not(:empty) {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        box-sizing: border-box;
      }

      [data-wfs-status]:not(:empty) {
        color: #4ade80;
        background: rgba(10, 36, 22, 0.95);
        border: 1px solid rgba(74, 222, 128, 0.4);
      }

      [data-wfs-error]:not(:empty) {
        color: #f87171;
        background: rgba(45, 10, 15, 0.95);
        border: 1px solid rgba(248, 113, 113, 0.4);
      }

      @keyframes wfsOptionsToastFloat {
        from {
          opacity: 0;
          transform: translate(-50%, 14px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0) scale(1);
        }
      }

      /*
       * Prompts and rating footer.
       *
       * The shell only carries the empty container and the styling; every string
       * comes from HELP_COPY in the source, so both surfaces read the same copy
       * and no wording can drift into an HTML file.
       *
       * There is no first-run greeting here any more. It was a card above the
       * settings that thanked the reader and asked them to pin the extension,
       * which meant a fresh install opened onto every preference the extension
       * has in order to say two sentences. It is its own page now
       * (`welcome/index.html`, rendered by §13), and this page is settings only.
       */

      /*
       * Each region is one wrapping column. That is what keeps the popup's 320 px
       * width free of horizontal scrolling, and the options page uses the same
       * rules so the two surfaces cannot drift apart visually.
       */
      .wfs-prompt {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        min-width: 0;
        overflow-wrap: break-word;
      }

      /* --- Footer: one row, stars leading, privacy trailing ----------------- */
      /* The same two-column shape as the popup, so the surfaces cannot drift.
         Not sticky here: the options page is a short document in a full tab, so
         there is nothing to pin the row against. */
      .wfs-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--wfs-border);
      }

      /* Feedback and Privacy, together on the trailing edge. */
      .wfs-footer__links {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: none;
      }

      /* Neither wraps nor shrinks: one label, five 24 px controls, and two short
         links fit any width this page has. Wrapping would put the links under the
         stars and bring back the stacked block this replaced. Margins are zeroed
         against the generic `#app a` rule, whose negative insets are meant for the
         padded links in the settings body. */
      /* The `#app` prefix is load-bearing: the footer renders inside `#app`, and
         `#app a` carries an id, so a class-only selector loses to it and both
         links shipped at accent-blue 600 — the loudest thing in a row whose job
         is to be quiet. They match the "Rate us" label instead, and take colour
         only on hover. */
      #app .wfs-footer__links > a {
        flex: none;
        margin: 0;
        padding: 2px 4px;
        font-size: 12px;
        font-weight: 400;
        color: var(--wfs-muted);
        white-space: nowrap;
      }

      #app .wfs-footer__links > a:hover {
        background: none;
        color: var(--wfs-text);
        text-decoration: underline;
      }

      /* "Rate us" and the stars are one unit on the leading edge. Tighter than the
         surface's usual 8 px: the first star's 24 px box already contributes ~2 px
         of side bearing before the glyph starts, so a wider gap reads as two things
         rather than one labelled group. */
      .wfs-footer__lead {
        display: flex;
        align-items: center;
        gap: 3px;
        min-width: 0;
      }

      /* Small and quiet: it names the stars rather than heading a section. */
      .wfs-footer__label {
        font-size: 12px;
        font-weight: 500;
        color: var(--wfs-muted);
        white-space: nowrap;
      }

      /* --- Tips: a collapsed disclosure ------------------------------------- */
      /* The summary carries the same uppercase micro-label as every other section
         heading, so a collapsed Tips row is indistinguishable from a section title
         until it is opened — which is the point. One line at rest. */
      .wfs-tips > summary {
        cursor: pointer;
        list-style: none;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--wfs-muted);
        padding: 2px 6px;
        margin: -2px -6px;
        border-radius: 6px;
        transition: background 140ms ease, color 140ms ease;
      }

      .wfs-tips > summary:hover {
        background: var(--wfs-accent-dim);
        color: var(--wfs-accent);
      }

      .wfs-tips > summary:focus-visible {
        outline: none;
        box-shadow: var(--wfs-ring);
      }

      /* The default triangle is replaced with one that rotates, so the control
         reads as openable rather than as a bulleted heading. */
      .wfs-tips > summary::before {
        content: "▸";
        display: inline-block;
        width: 1em;
        margin-right: 2px;
        transition: transform 140ms ease;
      }

      .wfs-tips[open] > summary::before {
        transform: rotate(90deg);
      }

      /* `::-webkit-details-marker` is the only way to remove Chrome's own marker;
         `list-style: none` above covers the standard path. */
      .wfs-tips > summary::-webkit-details-marker {
        display: none;
      }

      .wfs-tips [data-wfs-tip] {
        margin: 10px 0 0;
        font-size: 13px;
        color: var(--wfs-muted);
        max-width: 58ch;
      }

      /* --- Shortcut row: always visible, never behind the disclosure -------- */
      .wfs-shortcut {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      /* The lead-in word only; the keys beside it carry the emphasis. */
      .wfs-shortcut [data-wfs-help-shortcut] {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--wfs-muted);
      }

      /* The keys themselves, as a key cap — the one thing in the row the reader is
         looking for. A uniform "Shortcut: Alt+R" made them read a sentence for it. */
      .wfs-shortcut [data-wfs-help-combo] {
        padding: 2px 8px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.5;
        color: var(--wfs-text);
        background: var(--wfs-elevated);
        border: 1px solid var(--wfs-border);
        border-radius: 6px;
        /* Tabular figures so a combination containing a digit does not shift the
           row's width between renders. */
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .wfs-shortcut button,
      .wfs-prompt button {
        min-height: 24px;
        padding: 4px 10px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--wfs-accent);
        background: var(--wfs-accent-dim);
        border: 1px solid var(--wfs-border);
        border-radius: 6px;
        cursor: pointer;
        transition: background 140ms ease, color 140ms ease;
      }

      .wfs-shortcut button:hover,
      .wfs-prompt button:hover {
        background: var(--wfs-accent-dim-hover);
        color: var(--wfs-accent-hover);
      }

      .wfs-shortcut button:focus-visible,
      .wfs-prompt button:focus-visible {
        outline: none;
        box-shadow: var(--wfs-ring);
      }

      /* The rating prompt's two destinations are anchors, not buttons, so
         middle-click and "open in new tab" work on them. They still have to read as
         controls in a row of controls, so this gives them the button's box.
         
         Scoped by `#app` deliberately. `#app a` above is id-scoped, so a bare
         `.wfs-prompt__action` class loses to it on specificity no matter where it
         sits in the file — which is how these first shipped, wearing plain link
         styling. Worse, `#app a` carries `margin: -4px -8px` to let prose links sit
         flush in a paragraph, and on two adjacent links in a flex row that negative
         margin ate the 8 px gap and overlapped them. `margin: 0` is the fix for that
         half and is not optional. */
      #app .wfs-prompt__action {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        margin: 0;
        padding: 4px 10px;
        font-size: 13px;
        background: var(--wfs-accent-dim);
        border: 1px solid var(--wfs-border);
        border-radius: 6px;
      }

      #app .wfs-prompt__action:hover {
        background: var(--wfs-accent-dim-hover);
        color: var(--wfs-accent-hover);
      }

      /* The primary CTA in the rating prompt stands out in blue so the reader's
         eye lands there first. */
      #app .wfs-prompt__action[data-wfs-prompt-rate] {
        color: #fff;
        background: #3b82f6;
        border-color: #3b82f6;
      }

      #app .wfs-prompt__action[data-wfs-prompt-rate]:hover {
        background: #2563eb;
        border-color: #2563eb;
      }

      .wfs-prompt {
        width: 100%;
        padding: 12px 14px;
        background: var(--wfs-elevated);
        border: 1px solid var(--wfs-border);
        border-radius: 10px;
      }

      /* Actions and links wrap rather than widening their row. */
      .wfs-prompt__actions,
      .wfs-footer__links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .wfs-footer {
        width: 100%;
        margin-top: 28px;
        padding-top: 24px;
        border-top: 1px solid var(--wfs-border);
      }

      /* No gap: the 24 px boxes separate the glyphs on their own, and an added gap
         was what made the row look strung out. */
      .wfs-stars {
        display: flex;
        align-items: center;
        gap: 0;
        min-width: 0;
        /* Cancels the first glyph's own side bearing so the row sits against the
           label instead of looking indented from it. Only the painted glyph shifts;
           the 24 px target still starts inside the footer's own padding. */
        margin-left: -2px;
      }

      /* 24 x 24 px exactly: the floor WCAG 2.2 target-size (AA) allows, and the
         floor `npm run verify:live` measures. The box cannot shrink to pull the
         glyphs together, so the glyph grows into it instead — a 15 px glyph left
         enough dead space either side to read as five separate controls rather
         than one star row. The pitch cannot go under 24 px — that needs overlapping
         boxes, and an overlapped target is only nominally 24 px because the
         neighbour on top of it takes the clicks — so the remaining gap is closed by
         the glyph instead. U+2605 inks about 0.83em, so 25 px fills ~21 px of the
         24 px pitch and leaves ~3 px between painted edges.

         `line-height: 0.8` (20 px) is what keeps the box 24 px tall with a 25 px
         glyph in it, so `min-height` still decides the height and the row does not
         grow. */
      .wfs-star {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 24px;
        min-height: 24px;
        padding: 0;
        font-size: 25px;
        line-height: 0.8;
        color: var(--wfs-muted);
        background: none;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
        transition: color 140ms ease, background 140ms ease;
      }

      .wfs-star:hover {
        background: var(--wfs-accent-dim);
      }

      .wfs-star.is-filled {
        color: var(--wfs-accent);
      }

      /*
       * An outline rather than the shared box-shadow ring: 2 px is the required
       * floor and an outline width is what a layout check can read back off the
       * element.
       */
      .wfs-star:focus-visible {
        outline: 2px solid var(--wfs-accent);
        outline-offset: 2px;
      }

      /*
       * Pro: the licence field, and the per-channel rules.
       *
       * This block exists TWICE — here and in `popup/index.html` — because §11
       * renders one tree into two hand-written stylesheets and nothing checks that
       * they agree. The unit tests see structure, not layout. If you change
       * anything here, change it there: the two files use different id prefixes
       * (`#app` here, `#settings` there), so the selectors are not copy-pasteable
       * and the temptation to fix only one is real. That is how the rating prompt
       * once shipped with its primary control half-hidden behind its sibling.
       *
       * The `#app` prefix is load-bearing on every rule that touches a link, a
       * label, or a paragraph, for the reason recorded against
       * `.wfs-prompt__action`: `#app a`, `#app label` and `#app p` carry an id, so
       * a class-only or attribute-only selector loses to them wherever it sits in
       * the file.
       */

      /*
       * The tab strip, and the two panels it switches.
       *
       * The strip sits directly under the page heading and above everything else,
       * so the reader chooses between "my settings" and "Pro" before reading either.
       * It is styled as an underlined row rather than as two buttons, because two
       * accent-filled buttons side by side read as two actions to take rather than
       * as one choice already made.
       */
      #app [data-wfs-tabs] {
        display: flex;
        gap: 4px;
        margin: 16px 0 0;
        border-bottom: 1px solid var(--wfs-border);
      }

      #app [data-wfs-tab] {
        min-height: 32px;
        padding: 6px 12px;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--wfs-muted);
        background: none;
        border: 0;
        /* The selected tab's underline sits on top of the strip's own border, so
           the two lines are the same 1 px rule rather than a 2 px stack. */
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        cursor: pointer;
        transition: color 140ms ease, border-color 140ms ease;
      }

      #app [data-wfs-tab]:hover {
        color: var(--wfs-text);
      }

      #app [data-wfs-tab][aria-selected="true"] {
        color: var(--wfs-accent);
        border-bottom-color: var(--wfs-accent);
      }

      #app [data-wfs-tab]:focus-visible {
        outline: none;
        box-shadow: var(--wfs-ring);
        border-radius: 6px 6px 0 0;
      }

      /* Stated rather than left to the browser's default: `#app section` and the
         panel rules below both set `display`, and a `display` that wins over the
         `hidden` attribute is how a hidden panel shows through. */
      #app [data-wfs-panel][hidden] {
        display: none;
      }

      /* A panel opens straight into its first region, so that region drops the
         divider it would otherwise draw immediately under the tab strip. */
      #app [data-wfs-panel] > section:first-child,
      #app [data-wfs-panel] > *:first-child > section:first-child {
        margin-top: 20px;
        padding-top: 0;
        border-top: 0;
      }

      /* A tabpanel is focusable so a keyboard reader lands inside the panel they
         just chose; it must not draw a focus ring for a pointer user's click. */
      #app [data-wfs-panel]:focus {
        outline: none;
      }

      #app [data-wfs-panel]:focus-visible {
        outline: none;
        box-shadow: var(--wfs-ring);
        border-radius: 10px;
      }

      /* The status line reads as a statement of fact rather than as a heading. */
      #app [data-wfs-pro-status] {
        margin: 0 0 10px;
        font-size: 13px;
        font-weight: 600;
        color: var(--wfs-text);
      }

      #app [data-wfs-pro-body] {
        margin: 0 0 12px;
      }

      /* The price, alone on its line and the largest thing in the panel. A paywall
         that makes the reader hunt for the number is the thing everybody hates
         about paywalls. */
      #app [data-wfs-pro-price] {
        margin: 0 0 4px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--wfs-text);
      }

      /* --- What is being sold ----------------------------------------------- */
      #app [data-wfs-pro-features] {
        margin: 0 0 16px;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* Name over detail, not name-colon-detail on one line: three rows of running
         prose is a paragraph pretending to be a list, and the reader is scanning
         for whether one of the three is worth $5. */
      #app [data-wfs-pro-feature] {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 10px 12px;
        background: var(--wfs-elevated);
        border: 1px solid var(--wfs-border);
        border-radius: 10px;
      }

      #app [data-wfs-pro-feature-name] {
        font-size: 13px;
        font-weight: 600;
        color: var(--wfs-text);
      }

      #app [data-wfs-pro-feature-detail] {
        font-size: 13px;
        color: var(--wfs-muted);
      }

      #app [data-wfs-pro-have] {
        margin: 16px 0 10px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--wfs-muted);
      }

      /* --- The two collapsed jobs: enter a key, and give it back ------------- */
      /* Same disclosure treatment as Tips, by attribute rather than by class: both
         of these are one quiet row at rest and neither should read as a section
         heading competing with the pitch above it. */
      #app [data-wfs-pro-activate-details],
      #app [data-wfs-pro-remove-details] {
        margin-top: 8px;
        padding-top: 16px;
        border-top: 1px solid var(--wfs-border);
      }

      #app [data-wfs-pro-activate-details] > summary,
      #app [data-wfs-pro-remove-details] > summary {
        cursor: pointer;
        list-style: none;
        font-size: 12px;
        font-weight: 600;
        color: var(--wfs-muted);
        padding: 2px 6px;
        margin: -2px -6px 0;
        border-radius: 6px;
        transition: background 140ms ease, color 140ms ease;
      }

      #app [data-wfs-pro-activate-details] > summary:hover,
      #app [data-wfs-pro-remove-details] > summary:hover {
        background: var(--wfs-accent-dim);
        color: var(--wfs-accent);
      }

      #app [data-wfs-pro-activate-details] > summary:focus-visible,
      #app [data-wfs-pro-remove-details] > summary:focus-visible {
        outline: none;
        box-shadow: var(--wfs-ring);
      }

      #app [data-wfs-pro-activate-details] > summary::before,
      #app [data-wfs-pro-remove-details] > summary::before {
        content: "▸";
        display: inline-block;
        width: 1em;
        margin-right: 2px;
        transition: transform 140ms ease;
      }

      #app [data-wfs-pro-activate-details][open] > summary::before,
      #app [data-wfs-pro-remove-details][open] > summary::before {
        transform: rotate(90deg);
      }

      #app [data-wfs-pro-activate-details] > summary::-webkit-details-marker,
      #app [data-wfs-pro-remove-details] > summary::-webkit-details-marker {
        display: none;
      }

      /* Inside the disclosure the status line is an answer to the button below it,
         not the panel's headline, so it loses the headline's weight. */
      #app [data-wfs-pro-activate-details] [data-wfs-pro-status] {
        margin: 10px 0 0;
        font-weight: 500;
      }

      #app [data-wfs-pro-once] {
        margin: 6px 0 12px;
        font-size: 12px;
      }

      /* The buy link is the loudest thing in the section, and the only place on
         either surface that carries a price. Overrides `#app a`'s negative insets,
         which are meant for prose links and would pull this under its neighbour. */
      #app [data-wfs-pro-buy] {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        margin: 0 0 14px;
        padding: 5px 12px;
        font-size: 13px;
        color: #fff;
        background: #3b82f6;
        border: 1px solid #3b82f6;
        border-radius: 6px;
      }

      #app [data-wfs-pro-buy]:hover {
        color: #fff;
        background: #2563eb;
        border-color: #2563eb;
      }

      /* `width: 100%` with `box-sizing` already global */
      #app input[type="text"]:not(.wfs-channel-input) {
        width: 100%;
        min-height: 32px;
        padding: 6px 10px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 13px;
        color: var(--wfs-text);
        background: var(--wfs-bg);
        border: 1px solid var(--wfs-border);
        border-radius: 6px;
      }

      #app input[type="text"]:focus-visible {
        outline: none;
        box-shadow: var(--wfs-ring);
      }

      #app [data-wfs-pro-activate],
      #app [data-wfs-pro-remove] {
        min-height: 28px;
        margin-top: 10px;
        padding: 5px 12px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--wfs-accent);
        background: var(--wfs-accent-dim);
        border: 1px solid var(--wfs-border);
        border-radius: 6px;
        cursor: pointer;
      }

      #app [data-wfs-pro-activate]:hover,
      #app [data-wfs-pro-remove]:hover {
        background: var(--wfs-accent-dim-hover);
        color: var(--wfs-accent-hover);
      }

      #app [data-wfs-pro-activate]:focus-visible,
      #app [data-wfs-pro-remove]:focus-visible {
        outline: none;
        box-shadow: var(--wfs-ring);
      }

      /* Quiet, and small: it is a note about what leaves the device, not a warning. */
      #app [data-wfs-pro-privacy] {
        font-size: 12px;
      }

      /* --- Collage Dashboard Grid --- */
      #app .wfs-collage-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        margin-top: 16px;
      }

      @media (max-width: 720px) {
        #app .wfs-collage-grid {
          grid-template-columns: 1fr;
        }
      }

      /* Card spanning for full-width components */
      #app [data-wfs-card="channels"],
      #app [data-wfs-card="backup"] {
        grid-column: 1 / -1;
      }

      /* --- Visual Group Cards --- */
      #app .wfs-card {
        background: var(--wfs-elevated);
        border: 1px solid var(--wfs-border);
        border-radius: 14px;
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: var(--wfs-glow);
        transition: transform 120ms ease, box-shadow 140ms ease, border-color 140ms ease;
      }

      #app .wfs-card:hover {
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      }

      #app .wfs-card__header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 2px;
      }

      #app .wfs-card__header-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
      }

      #app .wfs-card__title {
        font-size: 14.5px;
        font-weight: 700;
        color: var(--wfs-text);
        letter-spacing: -0.01em;
      }

      #app .wfs-card__subtitle {
        font-size: 12px;
        color: var(--wfs-muted);
        line-height: 1.4;
      }

      /* Tier badges on cards */
      #app .wfs-card__badge {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 2px 8px;
        border-radius: 12px;
        white-space: nowrap;
        flex: none;
      }

      #app .wfs-card__badge.is-free {
        color: var(--wfs-on);
        background: var(--wfs-on-bg);
        border: 1px solid rgba(109, 214, 156, 0.25);
      }

      #app .wfs-card__badge.is-pro {
        color: #a78bfa;
        background: rgba(139, 92, 246, 0.12);
        border: 1px solid rgba(139, 92, 246, 0.3);
      }

      #app .wfs-card__badge.is-mix {
        color: var(--wfs-accent);
        background: var(--wfs-accent-dim);
        border: 1px solid rgba(232, 168, 56, 0.3);
      }

      /* Modern Horizontal Setting Rows */
      #app .wfs-setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 14px;
        margin: 0;
        background: var(--wfs-bg);
        border: 1px solid var(--wfs-border);
        border-radius: 10px;
        cursor: pointer;
        transition: background 140ms ease, border-color 140ms ease, transform 100ms ease;
      }

      #app .wfs-setting-row:hover {
        background: var(--wfs-accent-dim);
        border-color: rgba(232, 168, 56, 0.25);
      }

      #app .wfs-setting-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
        min-width: 0;
      }

      #app .wfs-setting-title {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--wfs-text);
        line-height: 1.4;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      #app .wfs-setting-desc {
        font-size: 12px;
        color: var(--wfs-muted);
        line-height: 1.4;
        margin: 0;
      }

      #app .wfs-pro-lock {
        font-size: 12px;
        opacity: 0.75;
      }

      /* iOS-style toggle switches */
      #app .wfs-switch {
        position: relative;
        width: 42px;
        height: 24px;
        flex: none;
        cursor: pointer;
      }

      #app .wfs-switch input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
        margin: 0;
      }

      #app .wfs-slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: var(--wfs-surface);
        border: 1px solid var(--wfs-border);
        border-radius: 24px;
        transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }

      #app .wfs-slider::before {
        content: "";
        position: absolute;
        height: 18px;
        width: 18px;
        left: 2px;
        bottom: 2px;
        background: var(--wfs-muted);
        border-radius: 50%;
        transition: transform 160ms cubic-bezier(0.175, 0.885, 0.32, 1.275), background 160ms ease;
      }

      #app .wfs-switch input:checked + .wfs-slider {
        background: var(--wfs-accent);
        border-color: var(--wfs-accent);
      }

      #app .wfs-switch input:checked + .wfs-slider::before {
        transform: translateX(18px);
        background: #ffffff;
      }

      #app .wfs-switch input:focus-visible + .wfs-slider {
        box-shadow: var(--wfs-ring);
      }

      /* Backup & Restore Action Row */
      #app [data-wfs-backup-row] {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 4px;
      }

      #app [data-wfs-backup-row] button {
        flex: 1;
        min-width: 150px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 8px;
        border: 1px solid var(--wfs-border);
        background: var(--wfs-surface);
        color: var(--wfs-text);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: all 140ms ease;
      }

      #app [data-wfs-backup-row] button:hover {
        border-color: var(--wfs-accent);
        background: var(--wfs-accent-dim);
        color: var(--wfs-accent);
      }

      #app .wfs-card-btn {
        align-self: flex-start;
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 600;
        color: var(--wfs-text);
        background: var(--wfs-surface);
        border: 1px solid var(--wfs-border);
        border-radius: 6px;
        cursor: pointer;
        transition: background 140ms ease, border-color 140ms ease;
      }

      #app .wfs-card-btn:hover {
        background: var(--wfs-accent-dim);
        border-color: var(--wfs-accent);
      }

      /* Quick Action Button */
      #app .wfs-quick-action-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 9px 16px;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #e8a838, #c47f0a);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 100ms ease, box-shadow 140ms ease, opacity 140ms ease;
      }

      #app .wfs-quick-action-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(232, 168, 56, 0.25);
      }

      /* --- Custom Letterbox Palette & Themes --- */
      #app .wfs-letterbox-section {
        background: var(--wfs-surface);
        border: 1px solid var(--wfs-border);
        border-radius: 10px;
        padding: 16px;
        margin-top: 6px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #app .wfs-letterbox-header {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      #app .wfs-letterbox-title {
        font-size: 13.5px;
        font-weight: 700;
        color: var(--wfs-text);
      }

      #app .wfs-letterbox-note {
        font-size: 12px;
        color: var(--wfs-muted);
        line-height: 1.4;
        margin: 0;
      }

      #app .wfs-swatch-group-label {
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--wfs-muted);
        margin-top: 6px;
      }

      #app .wfs-presets-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 4px;
      }

      #app .wfs-preset-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      #app .wfs-color-swatch {
        width: 30px;
        height: 30px;
        border-radius: 6px;
        border: 1px solid rgba(0, 0, 0, 0.5);
        cursor: pointer;
        flex: none;
        transition: transform 120ms ease, outline 120ms ease, border-color 120ms ease;
      }

      #app .wfs-color-swatch:hover {
        transform: scale(1.15);
      }

      #app .wfs-color-swatch.is-selected {
        outline: 2px solid #ffffff;
        outline-offset: 1px;
        transform: scale(1.1);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
      }

      #app .wfs-theme-swatch {
        transform: skewX(-12deg);
        min-height: 30px;
        padding: 6px 14px;
        border-radius: 5px;
        border: 1px solid rgba(0, 0, 0, 0.6);
        box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.85);
        color: #ffffff;
        font-size: 11px;
        font-weight: 800;
        font-style: italic;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        transition: transform 120ms ease, box-shadow 140ms ease;
      }

      #app .wfs-theme-swatch:hover {
        transform: skewX(-12deg) translateY(-1px);
        box-shadow: 2px 3px 0px rgba(0, 0, 0, 1);
      }

      #app .wfs-theme-swatch.is-selected {
        border-color: #ffffff;
        box-shadow: 0 0 0 2px #ffffff, 2px 2px 0px rgba(0, 0, 0, 0.9);
      }

      #app .wfs-color-custom-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
      }

      #app .wfs-color-preview-box {
        width: 42px;
        height: 34px;
        border-radius: 6px;
        border: 1.5px solid rgba(255, 255, 255, 0.15);
        background: #000000;
        flex: none;
        box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.5);
      }

      #app .wfs-color-hex-input {
        flex: 1;
        min-height: 34px;
        padding: 6px 10px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        color: var(--wfs-text);
        background: var(--wfs-bg);
        border: 1px solid var(--wfs-border);
        border-radius: 6px;
      }

      #app .wfs-color-hex-input:focus {
        outline: none;
        border-color: var(--wfs-accent);
        box-shadow: var(--wfs-ring);
      }

      #app .wfs-color-reset-btn {
        padding: 6px 14px;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #000000;
        background: #ff6b9d;
        border: 1px solid rgba(0, 0, 0, 0.3);
        border-radius: 6px;
        cursor: pointer;
        white-space: nowrap;
        transition: background 120ms ease, transform 100ms ease;
      }

      #app .wfs-color-reset-btn:hover {
        background: #ff528a;
        transform: translateY(-1px);
      }

      #app .wfs-color-reset-btn:active {
        transform: translateY(0);
      }

      /* --- Screenshot Filename Format --- */
      #app .wfs-template-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px;
        background: var(--wfs-alt);
        border: 1px solid var(--wfs-border);
        border-radius: 10px;
      }

      #app .wfs-template-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      #app .wfs-template-title {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--wfs-text);
      }

      #app .wfs-template-input {
        width: 100%;
        box-sizing: border-box;
        min-height: 32px;
        padding: 6px 10px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        color: #ffffff;
        background: #0b0a14;
        border: 1px solid var(--wfs-border);
        border-radius: 6px;
      }

      #app .wfs-template-input:focus {
        outline: none;
        border-color: var(--wfs-accent);
        box-shadow: 0 0 0 2px rgba(147, 51, 234, 0.25);
      }

      #app .wfs-template-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      #app .wfs-tag-badge {
        padding: 3px 8px;
        font-size: 11px;
        font-weight: 600;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: var(--wfs-accent-text);
        background: var(--wfs-accent-dim);
        border: 1px solid rgba(147, 51, 234, 0.3);
        border-radius: 5px;
        cursor: pointer;
        transition: background 120ms ease, transform 100ms ease;
      }

      #app .wfs-tag-badge:hover {
        background: rgba(147, 51, 234, 0.2);
        transform: translateY(-1px);
      }

      /* --- Auto-Fullscreen Channels --- */
      #app .wfs-channel-list,
      #app [data-wfs-channel-list] {
        list-style: none;
        margin: 0 0 6px 0;
        padding: 0 2px 0 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: 120px;
        overflow-y: auto;
        scrollbar-width: thin;
      }

      #app .wfs-channel-item,
      #app [data-wfs-channel-item] {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 8px;
        background: var(--wfs-alt);
        border: 1px solid var(--wfs-border);
        border-radius: 6px;
        min-height: 28px;
        box-sizing: border-box;
      }

      #app .wfs-channel-name,
      #app [data-wfs-channel-item] > span {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11.5px;
        font-weight: 600;
        color: #ffffff;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
      }

      #app .wfs-channel-remove-btn,
      #app [data-wfs-channel-remove] {
        flex: none;
        margin: 0 !important;
        padding: 2px 7px;
        font-size: 10px;
        font-weight: 700;
        color: #ff6b9d;
        background: rgba(255, 107, 157, 0.1);
        border: 1px solid rgba(255, 107, 157, 0.25);
        border-radius: 4px;
        cursor: pointer;
        line-height: 1.2;
        transition: background 120ms ease;
      }

      #app .wfs-channel-remove-btn:hover,
      #app [data-wfs-channel-remove]:hover {
        background: rgba(255, 107, 157, 0.22);
      }

      #app .wfs-channel-add-row,
      #app [data-wfs-channel-field] {
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        gap: 6px !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      #app .wfs-channel-input,
      #app [data-wfs-channel-input] {
        flex: 1 !important;
        min-width: 0 !important;
        width: auto !important;
        min-height: 28px !important;
        height: 28px !important;
        padding: 4px 8px !important;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11.5px !important;
        color: #ffffff;
        background: #0b0a14 !important;
        border: 1px solid var(--wfs-border) !important;
        border-radius: 6px !important;
        margin: 0 !important;
        box-sizing: border-box;
      }

      #app .wfs-channel-input:focus,
      #app [data-wfs-channel-input]:focus {
        outline: none;
        border-color: var(--wfs-accent);
        box-shadow: 0 0 0 2px rgba(147, 51, 234, 0.25);
      }

      #app .wfs-channel-add-btn,
      #app [data-wfs-channel-add] {
        flex: none !important;
        min-height: 28px !important;
        height: 28px !important;
        margin: 0 !important;
        padding: 0 12px !important;
        font-size: 11px !important;
        font-weight: 700 !important;
        color: #ffffff !important;
        background: linear-gradient(135deg, #7c3aed, #9333ea) !important;
        border: 1px solid rgba(255, 255, 255, 0.12) !important;
        border-radius: 6px !important;
        cursor: pointer;
        white-space: nowrap;
        transition: transform 100ms ease;
      }

      #app .wfs-channel-add-btn:hover,
      #app [data-wfs-channel-add]:hover {
        transform: translateY(-1px);
        background: linear-gradient(135deg, #8b5cf6, #a855f7) !important;
      }

      /* --- Pro showcase card ------------------------------------------------ */
      /* The same visual language as the popup's Pro card, scaled to the
         wider options surface. The gradient stripe, feature grid, and inline
         activation form share data attributes and intent with the popup
         version, but the selectors here are `#app`-scoped because of the
         specificity war documented above. */
      #app [data-wfs-pro-card] {
        position: relative;
        padding: 24px;
        background: var(--wfs-elevated);
        border: 1px solid var(--wfs-border);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: var(--wfs-glow);
      }

      /* Gradient top stripe — the "this is premium" signal. */
      #app [data-wfs-pro-card]::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);
        border-radius: 14px 14px 0 0;
      }

      #app [data-wfs-pro-card].is-active::before {
        background: linear-gradient(90deg, #10b981, #06b6d4, #3b82f6);
      }

      /* Header: emoji badge + title + price pill */
      #app [data-wfs-pro-header] {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }

      #app [data-wfs-pro-badge] {
        font-size: 22px;
        line-height: 1;
      }

      #app [data-wfs-pro-title] {
        font-size: 18px;
        font-weight: 700;
        color: var(--wfs-text);
      }

      #app [data-wfs-pro-pill] {
        margin-left: auto;
        padding: 3px 10px;
        font-size: 12px;
        font-weight: 700;
        color: #7c3aed;
        background: rgba(139, 92, 246, 0.1);
        border-radius: 20px;
        white-space: nowrap;
      }

      /* Pitch line */
      #app [data-wfs-pro-pitch] {
        margin: 0 0 16px;
        font-size: 14px;
        color: var(--wfs-muted);
        line-height: 1.5;
      }

      /* Feature grid: three cards, vertical stack */
      #app [data-wfs-pro-features-grid] {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
      }

      #app [data-wfs-pro-feature-card] {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 16px;
        background: var(--wfs-bg);
        border: 1px solid var(--wfs-border);
        border-radius: 10px;
        transition: border-color 140ms ease, box-shadow 140ms ease;
      }

      #app [data-wfs-pro-feature-card]:hover {
        border-color: rgba(139, 92, 246, 0.3);
        box-shadow: 0 2px 8px rgba(139, 92, 246, 0.06);
      }

      #app [data-wfs-pro-feature-icon] {
        flex: none;
        font-size: 20px;
        line-height: 1.3;
      }

      #app [data-wfs-pro-feature-card] [data-wfs-pro-feature-name] {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: var(--wfs-text);
        line-height: 1.4;
      }

      #app [data-wfs-pro-feature-card] [data-wfs-pro-feature-detail] {
        display: block;
        font-size: 13px;
        color: var(--wfs-muted);
        line-height: 1.4;
        margin-top: 2px;
      }

      /* Actions row: Buy CTA */
      #app [data-wfs-pro-actions] {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      /* Primary buy button — vivid gradient */
      #app [data-wfs-pro-buy-cta] {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        margin: 0;
        padding: 8px 20px;
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border: none;
        border-radius: 8px;
        text-decoration: none;
        cursor: pointer;
        transition: transform 100ms ease, box-shadow 140ms ease;
      }

      #app [data-wfs-pro-buy-cta]:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
        text-decoration: none;
        color: #fff;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
      }

      /* What you unlocked heading */
      #app [data-wfs-pro-have] {
        margin: 16px 0 10px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--wfs-muted);
      }

      /* Remove details disclosure */
      #app [data-wfs-pro-remove-details] {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--wfs-border);
      }

      #app [data-wfs-pro-remove-details] > summary {
        cursor: pointer;
        list-style: none;
        font-size: 12px;
        font-weight: 600;
        color: var(--wfs-muted);
        padding: 2px 6px;
        margin: -2px -6px 0;
        border-radius: 6px;
        transition: background 140ms ease, color 140ms ease;
      }

      #app [data-wfs-pro-remove-details] > summary:hover {
        background: var(--wfs-accent-dim);
        color: var(--wfs-accent);
      }

      #app [data-wfs-pro-remove-details] > summary:focus-visible {
        outline: none;
        box-shadow: var(--wfs-ring);
      }

      #app [data-wfs-pro-remove-details] > summary::before {
        content: "\u25B8";
        display: inline-block;
        width: 1em;
        margin-right: 2px;
        transition: transform 140ms ease;
      }

      #app [data-wfs-pro-remove-details][open] > summary::before {
        transform: rotate(90deg);
      }

      #app [data-wfs-pro-remove-details] > summary::-webkit-details-marker {
        display: none;
      }

      #app [data-wfs-pro-remove] {
        min-height: 28px;
        margin-top: 10px;
        padding: 5px 12px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--wfs-danger);
        background: var(--wfs-danger-bg);
        border: 1px solid var(--wfs-border);
        border-radius: 6px;
        cursor: pointer;
      }

      #app [data-wfs-pro-remove]:hover {
        background: rgba(240, 112, 104, 0.15);
      }

      /* Inline activation form */
      #app [data-wfs-pro-form] {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--wfs-border);
      }

      #app [data-wfs-pro-form-heading] {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--wfs-muted);
        margin: 0 0 10px;
      }

      #app [data-wfs-pro-inline-status] {
        margin: 0 0 10px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 500;
        color: var(--wfs-danger);
        background: var(--wfs-danger-bg);
        border-radius: 8px;
      }

      #app [data-wfs-pro-field] {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 4px;
        margin: 0;
        padding: 0;
        cursor: default;
      }

      #app [data-wfs-pro-field]:hover {
        background: none;
      }

      #app [data-wfs-pro-field] > span {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--wfs-muted);
      }

      #app [data-wfs-pro-activate] {
        min-height: 32px;
        margin-top: 10px;
        padding: 6px 16px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        background: var(--wfs-accent);
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 140ms ease;
      }

      #app [data-wfs-pro-activate]:hover {
        background: var(--wfs-accent-hover);
      }

      #app [data-wfs-pro-privacy] {
        margin-top: 10px;
        font-size: 12px;
        color: var(--wfs-muted);
      }

      @media (prefers-color-scheme: light) {
        #app [data-wfs-pro-pill] {
          color: #6d28d9;
          background: rgba(109, 40, 217, 0.08);
        }
      }

      @media (prefers-color-scheme: light) {
        #app input[type="text"] {
          background: var(--wfs-surface);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }

        /*
         * Stated again for the star controls on purpose: the requirement is a
         * 0 ms transition duration on them specifically, and the live layout
         * check reads that value off the element rather than trusting the
         * blanket rule above.
         */
        .wfs-star {
          transition-duration: 0ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
