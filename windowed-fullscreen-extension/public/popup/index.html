<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Windowed Fullscreen</title>
    <style>
      :root {
        color-scheme: light dark;

        /* Notion — warm minimalism. Pure white canvas, warm-neutral scale. */
        --wfs-bg: #ffffff;
        --wfs-surface: #ffffff;
        --wfs-alt: #f6f5f4; /* warm white section fill */
        --wfs-elevated: #ffffff;
        --wfs-text: rgba(0, 0, 0, 0.95); /* warm near-black, not pure */
        --wfs-secondary: #615d59; /* warm gray 500 */
        --wfs-muted: #a39e98; /* warm gray 300 */
        --wfs-border: rgba(0, 0, 0, 0.1); /* whisper border */

        /* Notion Blue — the sole saturated accent, used sparingly. */
        --wfs-accent: #0075de;
        --wfs-accent-hover: #005bab; /* active/pressed blue */
        --wfs-accent-dim: #f2f9ff; /* tinted blue badge surface */
        --wfs-accent-dim-hover: #e6f2ff;
        --wfs-accent-text: #097fe8; /* badge/focus blue */
        --wfs-on: #1aae39; /* green — confirmation */
        --wfs-on-bg: rgba(26, 174, 57, 0.08);
        --wfs-danger: #dd5b00; /* orange — warning */
        --wfs-danger-bg: rgba(221, 91, 0, 0.07);

        --wfs-ring: 0 0 0 2px #ffffff, 0 0 0 4px rgba(9, 127, 232, 0.5);

        /* Soft 4-layer card shadow (max opacity 0.04). */
        --wfs-shadow: rgba(0, 0, 0, 0.04) 0px 4px 18px,
          rgba(0, 0, 0, 0.027) 0px 2.025px 7.84688px,
          rgba(0, 0, 0, 0.02) 0px 0.8px 2.925px,
          rgba(0, 0, 0, 0.01) 0px 0.175px 1.04062px;

        --wfs-font: "Inter", -apple-system, system-ui, "Segoe UI", Helvetica,
          Arial, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          /* Warm dark variant keeping Notion's warm-neutral character. */
          --wfs-bg: #191918;
          --wfs-surface: #252420;
          --wfs-alt: #211f1c;
          --wfs-elevated: #2b2925;
          --wfs-text: rgba(255, 255, 255, 0.92);
          --wfs-secondary: #a39e98;
          --wfs-muted: #6f6a64;
          --wfs-border: rgba(255, 255, 255, 0.1);

          --wfs-accent: #2b8fee;
          --wfs-accent-hover: #4aa3f5;
          --wfs-accent-dim: rgba(43, 143, 238, 0.14);
          --wfs-accent-dim-hover: rgba(43, 143, 238, 0.2);
          --wfs-accent-text: #62aef0;
          --wfs-on: #4cc16a;
          --wfs-on-bg: rgba(76, 193, 106, 0.12);
          --wfs-danger: #f0803a;
          --wfs-danger-bg: rgba(240, 128, 58, 0.12);

          --wfs-ring: 0 0 0 2px var(--wfs-bg), 0 0 0 4px rgba(98, 174, 240, 0.5);
          --wfs-shadow: rgba(0, 0, 0, 0.3) 0px 4px 18px,
            rgba(0, 0, 0, 0.2) 0px 0.8px 2.925px;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 320px;
        font-family: var(--wfs-font);
        font-size: 14px;
        line-height: 1.5;
        color: var(--wfs-text);
        background: var(--wfs-bg);
        font-feature-settings: "lnum", "locl";
        -webkit-font-smoothing: antialiased;
      }

      #app {
        padding: 20px 18px 12px;
      }

      #settings {
        padding: 0 18px 20px;
      }

      /* --- Header ---------------------------------------------------------- */
      .wfs-popup__title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.25px;
        color: var(--wfs-text);
        margin-bottom: 16px;
      }

      /* --- Status card ------------------------------------------------------ */
      .wfs-popup__status {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px 16px;
        padding: 14px 16px;
        background: var(--wfs-alt);
        border: 1px solid var(--wfs-border);
        border-radius: 12px;
      }

      .wfs-popup__status dt {
        font-size: 14px;
        color: var(--wfs-secondary);
        font-weight: 400;
      }

      .wfs-popup__status dd {
        font-size: 14px;
        font-weight: 600;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .wfs-popup__status dd.is-on {
        color: var(--wfs-on);
      }

      .wfs-popup__status dd.is-off {
        color: var(--wfs-muted);
      }

      /* --- Main toggle ------------------------------------------------------ */
      /* Primary Notion Blue button: 4px radius, subtle scale on press. */
      .wfs-popup__toggle {
        margin-top: 16px;
        width: 100%;
        padding: 10px 16px;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
        background: var(--wfs-accent);
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
        transition: background 160ms ease, transform 100ms ease;
      }

      .wfs-popup__toggle:hover:not(:disabled) {
        background: var(--wfs-accent-hover);
      }

      .wfs-popup__toggle:active:not(:disabled) {
        transform: scale(0.97);
      }

      .wfs-popup__toggle:focus-visible {
        outline: none;
        box-shadow: var(--wfs-ring);
      }

      /* Active state reads as a secondary (translucent) button. */
      .wfs-popup__toggle.is-active {
        color: var(--wfs-accent-text);
        background: var(--wfs-accent-dim);
        border: 1px solid var(--wfs-border);
      }

      .wfs-popup__toggle.is-active:hover:not(:disabled) {
        background: var(--wfs-accent-dim-hover);
      }

      .wfs-popup__toggle.is-active:active:not(:disabled) {
        transform: scale(0.97);
      }

      .wfs-popup__toggle:disabled {
        color: var(--wfs-muted);
        background: rgba(0, 0, 0, 0.05);
        border: 1px solid transparent;
        cursor: not-allowed;
      }

      /* --- Settings --------------------------------------------------------- */
      #settings section {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--wfs-border);
      }

      #settings h2 {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.125px;
        color: var(--wfs-secondary);
        margin-bottom: 10px;
      }

      #settings label {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        cursor: pointer;
        font-size: 14px;
        line-height: 1.5;
        padding: 6px 8px;
        border-radius: 5px;
        margin: -6px -8px;
        transition: background 140ms ease;
      }

      #settings label:hover {
        background: var(--wfs-alt);
      }

      #settings input[type="checkbox"] {
        margin-top: 3px;
        width: 15px;
        height: 15px;
        accent-color: var(--wfs-accent);
        cursor: pointer;
        flex: none;
      }

      #settings input[type="checkbox"]:focus-visible {
        outline: none;
        box-shadow: var(--wfs-ring);
        border-radius: 3px;
      }

      /* Notion links: near-accent color, underline on hover. */
      #settings a {
        color: var(--wfs-accent);
        text-decoration: none;
        font-weight: 500;
        font-size: 14px;
        padding: 4px 8px;
        margin: -4px -8px;
        border-radius: 5px;
        transition: background 140ms ease, color 140ms ease;
      }

      #settings a:hover {
        text-decoration: underline;
        color: var(--wfs-accent-hover);
      }

      #settings a:focus-visible {
        outline: none;
        box-shadow: var(--wfs-ring);
      }

      #settings p {
        margin: 6px 0 0;
        font-size: 12px;
        color: var(--wfs-secondary);
        line-height: 1.43;
      }

      /* --- Feedback regions ------------------------------------------------- */
      [data-wfs-status],
      [data-wfs-error] {
        margin-top: 12px;
        font-size: 12px;
        min-height: 0;
        border-radius: 8px;
      }

      [data-wfs-status]:not(:empty),
      [data-wfs-error]:not(:empty) {
        padding: 9px 12px;
        font-weight: 500;
        border: 1px solid var(--wfs-border);
      }

      [data-wfs-status]:not(:empty) {
        color: var(--wfs-on);
        background: var(--wfs-on-bg);
      }

      [data-wfs-error]:not(:empty) {
        color: var(--wfs-danger);
        background: var(--wfs-danger-bg);
      }

      /* --- Motion respect --------------------------------------------------- */
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <section id="settings"></section>
    <script type="module" src="./main.js"></script>
  </body>
</html>
