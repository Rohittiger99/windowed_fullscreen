<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="asset-size" content="1280x800" />
    <title>Windowed Fullscreen — the buttons</title>
    <link rel="stylesheet" href="./_base.css" />
    <style>
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 60px 0;
        text-align: center;
      }

      h1 {
        margin-top: 12px;
        font-size: 46px;
      }

      .sub {
        margin-top: 12px;
      }

      /**
       * The strip and its pointers share one fixed-width group, so a pointer's
       * `left: %` is a percentage of the strip itself. Letting either stretch to
       * the stage width would silently shift every label.
       */
      .zoomgroup {
        width: 1120px;
        margin-top: 28px;
      }

      .zoom {
        position: relative;
        width: 100%;
        border-radius: 14px;
        border: 1px solid var(--border-strong);
        box-shadow: 0 24px 60px -18px rgba(0, 0, 0, 0.8);
        overflow: hidden;
      }

      /**
       * Three buttons, 48 CSS px apart, is closer together than their labels are
       * wide — so each label gets its own tier and a longer stem rather than
       * being crammed onto one line.
       */
      .pointers {
        position: relative;
        width: 100%;
        height: 130px;
        margin-top: 4px;
        text-align: left;
      }

      .pointer {
        position: absolute;
        top: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        transform: translateX(-50%);
      }

      .pointer .stem {
        width: 3px;
        background: var(--secondary);
      }

      .pointer.is-ours .stem {
        background: var(--amber);
      }

      .pointer .name {
        font-size: 22px;
        font-weight: 700;
        white-space: nowrap;
      }

      .pointer.is-ours .name {
        color: var(--amber);
      }

      .facts {
        display: flex;
        gap: 44px;
        margin-top: 30px;
        text-align: left;
      }

      .facts .check {
        max-width: 26ch;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="eyebrow"><span class="dot"></span>Built into the player</div>
      <h1 data-no-wrap>Two buttons, where you already look.</h1>
      <p class="sub">Added after YouTube's own controls, in YouTube's own style.</p>

      <div class="zoomgroup">
        <!--
          Crop: the right end of the control bar, magnified ~2.1x.
          Measured in raw/windowed.png: the control-bar buttons step by exactly
          60 source px (48 CSS px at this capture's 1.25 scale). Ours sit at
          x=1791 and x=1851, so YouTube's fullscreen button is x=1731.
        -->
        <div class="zoom">
          <div
            class="shot"
            style="--w: 1120px; --cx: 0.72; --cy: 0.855; --cw: 0.28; --ch: 0.089"
          >
            <img src="../raw/windowed.png" alt="" />
          </div>
        </div>

        <div class="pointers" data-no-overlap>
          <div class="pointer" style="left: 65%">
            <span class="stem" style="height: 20px"></span>
            <span class="name">YouTube's fullscreen</span>
          </div>
          <div class="pointer is-ours" style="left: 76.2%">
            <span class="stem" style="height: 52px"></span>
            <span class="name">Windowed fullscreen</span>
          </div>
          <div class="pointer is-ours" style="left: 87.3%">
            <span class="stem" style="height: 84px"></span>
            <span class="name">Comments panel</span>
          </div>
        </div>
      </div>

      <div class="facts">
        <div class="check">
          <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="9" fill="rgba(43,143,238,0.16)" />
            <path
              d="M5.6 10.3l2.9 2.9L14.4 7.3"
              fill="none"
              stroke="#2b8fee"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>YouTube's own fullscreen still works, untouched</span>
        </div>
        <div class="check">
          <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="9" fill="rgba(43,143,238,0.16)" />
            <path
              d="M5.6 10.3l2.9 2.9L14.4 7.3"
              fill="none"
              stroke="#2b8fee"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>A blue underline shows what's on</span>
        </div>
        <div class="check">
          <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="9" fill="rgba(43,143,238,0.16)" />
            <path
              d="M5.6 10.3l2.9 2.9L14.4 7.3"
              fill="none"
              stroke="#2b8fee"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Still there on the next video</span>
        </div>
      </div>
    </div>
  </body>
</html>
