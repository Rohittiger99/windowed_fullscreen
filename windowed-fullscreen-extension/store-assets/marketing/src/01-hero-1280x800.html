<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="asset-size" content="1280x800" />
    <title>Windowed Fullscreen — hero</title>
    <link rel="stylesheet" href="./_base.css" />
    <style>
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 60px 0;
      }

      header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
      }

      h1 {
        font-size: 48px;
        letter-spacing: -1.3px;
      }

      figure {
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <header>
        <h1 data-no-wrap>
          Fullscreen video. <span class="hl">Tabs and taskbar still there.</span>
        </h1>
        <p class="sub">Nothing on your screen disappears.</p>
      </header>

      <figure>
        <!--
          Uncropped capture, so an overlay's `%` maps straight onto the source.
          Measured in raw/windowed.png (1919x1079): browser chrome ends at y=108,
          the player runs y=109..1019, the taskbar starts at y=1021.
        -->
        <div class="shot framed" style="--w: 1046px">
          <img src="../raw/windowed.png" alt="" />

          <!-- Browser chrome band: tab strip + address bar. -->
          <div class="band" style="top: 0.37%; height: 9.45%"></div>
          <span class="tag" style="top: 11.4%; left: 14px">Tabs and address bar</span>

          <!-- Windows taskbar band. -->
          <div class="band" style="top: 94.63%; height: 5.1%"></div>
          <span class="tag" style="bottom: 7.2%; right: 14px">Taskbar and clock</span>
        </div>
      </figure>
    </div>
  </body>
</html>
