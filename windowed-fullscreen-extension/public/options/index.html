<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Windowed Fullscreen - Options</title>
    <style>
      :root {
        --wfs-text: #202124;
        --wfs-muted: #5f6368;
        --wfs-accent: #1a73e8;
        --wfs-on: #188038;
        --wfs-border: #e0e0e0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 16px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: var(--wfs-text);
        background: #f1f3f4;
      }
      #app {
        max-width: 560px;
        margin: 0 auto;
        padding: 28px 32px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 1px 3px rgba(60, 64, 67, 0.15);
      }
      #app h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 600;
      }
      #app section {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--wfs-border);
      }
      #app h2 {
        margin: 0 0 10px;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--wfs-muted);
      }
      #app label {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        cursor: pointer;
      }
      #app input[type="checkbox"] {
        margin: 2px 0 0;
        width: 16px;
        height: 16px;
        accent-color: var(--wfs-accent);
        cursor: pointer;
        flex: none;
      }
      #app a {
        color: var(--wfs-accent);
        text-decoration: none;
      }
      #app a:hover {
        text-decoration: underline;
      }
      #app p {
        margin: 8px 0 0;
        font-size: 13px;
        color: var(--wfs-muted);
      }
      [data-wfs-status],
      [data-wfs-error] {
        margin-top: 16px;
        font-size: 13px;
      }
      [data-wfs-status]:not(:empty),
      [data-wfs-error]:not(:empty) {
        padding: 9px 12px;
        border-radius: 6px;
      }
      [data-wfs-status]:not(:empty) {
        color: var(--wfs-on);
        background: #e6f4ea;
      }
      [data-wfs-error]:not(:empty) {
        color: #c5221f;
        background: #fce8e6;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
