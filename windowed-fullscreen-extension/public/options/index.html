<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Windowed Fullscreen - Options</title>
    <style>
      :root {
        color-scheme: dark light;

        /* Dark theater palette — warm charcoal base with amber glow. */
        --wfs-bg: #1a1a1e;
        --wfs-surface: #242428;
        --wfs-elevated: #2c2c31;
        --wfs-text: #f0ece6;
        --wfs-muted: #9e9a93;
        --wfs-border: rgba(255, 255, 255, 0.07);

        /* Warm amber accent. */
        --wfs-accent: #e8a838;
        --wfs-accent-hover: #f0b848;
        --wfs-accent-dim: rgba(232, 168, 56, 0.12);
        --wfs-accent-dim-hover: rgba(232, 168, 56, 0.18);
        --wfs-on: #6dd69c;
        --wfs-on-bg: rgba(109, 214, 156, 0.1);
        --wfs-danger: #f07068;
        --wfs-danger-bg: rgba(240, 112, 104, 0.1);

        --wfs-ring: 0 0 0 2px var(--wfs-bg), 0 0 0 4px rgba(232, 168, 56, 0.5);
        --wfs-glow: 0 4px 24px rgba(232, 168, 56, 0.06);

        --wfs-font: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --wfs-bg: #faf8f5;
          --wfs-surface: #ffffff;
          --wfs-elevated: #ffffff;
          --wfs-text: #1c1917;
          --wfs-muted: #78716c;
          --wfs-border: rgba(0, 0, 0, 0.08);

          --wfs-accent: #c47f0a;
          --wfs-accent-hover: #a86d08;
          --wfs-accent-dim: rgba(196, 127, 10, 0.08);
          --wfs-accent-dim-hover: rgba(196, 127, 10, 0.14);
          --wfs-on: #16803c;
          --wfs-on-bg: rgba(22, 128, 60, 0.08);
          --wfs-danger: #dc2626;
          --wfs-danger-bg: rgba(220, 38, 38, 0.06);

          --wfs-ring: 0 0 0 2px var(--wfs-bg), 0 0 0 4px rgba(196, 127, 10, 0.4);
          --wfs-glow: 0 4px 30px rgba(196, 127, 10, 0.04);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        font-family: var(--wfs-font);
        font-size: 14px;
        line-height: 1.55;
        color: var(--wfs-text);
        background: var(--wfs-bg);
        padding: 48px 20px;
        -webkit-font-smoothing: antialiased;
      }

      #app {
        max-width: 520px;
        margin: 0 auto;
        padding: 32px 36px 40px;
        background: var(--wfs-surface);
        border: 1px solid var(--wfs-border);
        border-radius: 16px;
        box-shadow: var(--wfs-glow);
      }

      #app h1 {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--wfs-accent);
        margin-bottom: 8px;
      }

      #app section {
        margin-top: 28px;
        padding-top: 24px;
        border-top: 1px solid var(--wfs-border);
      }

      #app h2 {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--wfs-muted);
        margin-bottom: 12px;
      }

      #app label {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        cursor: pointer;
        padding: 8px 10px;
        margin: -8px -10px;
        border-radius: 10px;
        transition: background 140ms ease;
      }

      #app label:hover {
        background: var(--wfs-accent-dim);
      }

      #app input[type="checkbox"] {
        margin-top: 3px;
        width: 16px;
        height: 16px;
        accent-color: var(--wfs-accent);
        cursor: pointer;
        flex: none;
      }

      #app input[type="checkbox"]:focus-visible {
        outline: none;
        box-shadow: var(--wfs-ring);
        border-radius: 4px;
      }

      #app a {
        color: var(--wfs-accent);
        text-decoration: none;
        font-weight: 600;
        padding: 4px 8px;
        margin: -4px -8px;
        border-radius: 6px;
        transition: background 140ms ease, color 140ms ease;
      }

      #app a:hover {
        background: var(--wfs-accent-dim);
        color: var(--wfs-accent-hover);
      }

      #app a:focus-visible {
        outline: none;
        box-shadow: var(--wfs-ring);
      }

      #app p {
        margin: 8px 0 0;
        font-size: 13px;
        color: var(--wfs-muted);
        max-width: 58ch;
      }

      [data-wfs-status],
      [data-wfs-error] {
        margin-top: 20px;
        font-size: 13px;
        border-radius: 10px;
      }

      [data-wfs-status]:not(:empty),
      [data-wfs-error]:not(:empty) {
        padding: 11px 14px;
        font-weight: 500;
      }

      [data-wfs-status]:not(:empty) {
        color: var(--wfs-on);
        background: var(--wfs-on-bg);
      }

      [data-wfs-error]:not(:empty) {
        color: var(--wfs-danger);
        background: var(--wfs-danger-bg);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
