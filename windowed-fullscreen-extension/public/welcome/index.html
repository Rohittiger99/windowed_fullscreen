<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to Windowed Fullscreen</title>
    <style>
      /*
       * The post-install page. Thanks, one ask, four hints.
       *
       * A stylesheet of its own rather than the options page's, even though the
       * palette is shared. The two pages want opposite type scales: settings are a
       * dense list of controls read at 13-14 px, and this is a greeting read once
       * at arm's length. Sharing one sheet meant every rule here had to be an
       * override of a rule meant for a form row.
       *
       * All strings come from HELP_COPY in the source (§13). This shell carries an
       * empty container and the styling only, so no wording can drift into an HTML
       * file.
       */
      :root {
        color-scheme: dark light;

        /* Same dark theater palette as the options page and popup. */
        --wfs-bg: #1a1a1e;
        --wfs-surface: #242428;
        --wfs-elevated: #2c2c31;
        --wfs-text: #f0ece6;
        --wfs-muted: #9e9a93;
        --wfs-border: rgba(255, 255, 255, 0.07);

        --wfs-accent: #e8a838;
        --wfs-accent-hover: #f0b848;
        --wfs-accent-dim: rgba(232, 168, 56, 0.12);
        --wfs-on: #6dd69c;
        --wfs-on-bg: rgba(109, 214, 156, 0.1);

        --wfs-glow: 0 4px 24px rgba(232, 168, 56, 0.06);
        --wfs-font: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --wfs-bg: #faf8f5;
          --wfs-surface: #ffffff;
          --wfs-elevated: #ffffff;
          --wfs-text: #1c1917;
          --wfs-muted: #78716c;
          --wfs-border: rgba(0, 0, 0, 0.08);

          --wfs-accent: #c47f0a;
          --wfs-accent-hover: #a86d08;
          --wfs-accent-dim: rgba(196, 127, 10, 0.08);
          --wfs-on: #16803c;
          --wfs-on-bg: rgba(22, 128, 60, 0.08);

          --wfs-glow: 0 4px 30px rgba(196, 127, 10, 0.04);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        font-family: var(--wfs-font);
        font-size: 15px;
        line-height: 1.6;
        color: var(--wfs-text);
        background: var(--wfs-bg);
        /* A soft accent wash behind the top of the page. It is the only decoration
           on the surface, and it is what stops a page holding six short lines from
           reading as an error message. */
        background-image: radial-gradient(
          120% 90% at 50% -30%,
          var(--wfs-accent-dim),
          transparent 65%
        );
        background-repeat: no-repeat;
        padding: 72px 20px 96px;
        -webkit-font-smoothing: antialiased;
      }

      #app {
        max-width: 620px;
        margin: 0 auto;
      }

      /* The product mark. No wordmark beside it — the title says the name on the
         next line, and printing it twice is how a greeting starts looking like a
         landing page. */
      .wfs-welcome__mark {
        display: block;
        width: 64px;
        height: 64px;
        margin-bottom: 28px;
      }

      [data-wfs-welcome-title] {
        font-size: 34px;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }

      .wfs-welcome__lead {
        margin-top: 14px;
        font-size: 17px;
        color: var(--wfs-muted);
        /* Held to a readable measure rather than the container's full width: 17 px
           across 620 px is a long line to track back from. */
        max-width: 46ch;
      }

      /* --- The ask ---------------------------------------------------------- */
      /* Deliberately the loudest block on the page. It is the only thing being
         asked of the reader, and a first-run page that does not get the extension
         pinned has failed at the one job it has. */
      [data-wfs-welcome-pin] {
        margin-top: 40px;
        padding: 24px 28px;
        background: var(--wfs-surface);
        border: 1px solid var(--wfs-border);
        /* A thick leading accent rule, not a full accent fill: the fill made the
           block read as a warning banner. */
        border-left: 4px solid var(--wfs-accent);
        border-radius: 14px;
        box-shadow: var(--wfs-glow);
      }

      .wfs-welcome__pin-callout {
        font-size: 26px;
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: -0.01em;
        color: var(--wfs-accent);
      }

      .wfs-welcome__pin-callout strong {
        font-weight: inherit;
      }

      /* A pin glyph leading the callout. Pure decoration, so it is generated by
         CSS and never reaches the accessible name. */
      .wfs-welcome__pin-callout::before {
        content: "📌";
        margin-right: 10px;
        /* The emoji renders large next to 26 px text on Windows; holding it back
           keeps the words the biggest thing in the row. */
        font-size: 22px;
      }

      .wfs-welcome__pin-how {
        margin-top: 8px;
        font-size: 15px;
        color: var(--wfs-muted);
        max-width: 52ch;
      }

      /* The already-pinned case. Same block, quieter: an acknowledgement, not an
         instruction. */
      .wfs-welcome__pin-done {
        font-size: 17px;
        font-weight: 600;
        color: var(--wfs-on);
      }

      [data-wfs-welcome-pin]:has(.wfs-welcome__pin-done) {
        border-left-color: var(--wfs-on);
        background: var(--wfs-on-bg);
      }

      /* --- Hints ------------------------------------------------------------ */
      [data-wfs-welcome-hints] {
        margin-top: 44px;
      }

      [data-wfs-welcome-hints] h2 {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--wfs-muted);
      }

      [data-wfs-welcome-hints] ul {
        margin-top: 16px;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 12px;
      }

      /* An accent dot for a marker instead of a disc, so four hints read as a set
         of tips rather than as terms and conditions. */
      [data-wfs-hint] {
        position: relative;
        padding-left: 22px;
        font-size: 15px;
        color: var(--wfs-text);
        max-width: 58ch;
      }

      [data-wfs-hint]::before {
        content: "";
        position: absolute;
        left: 4px;
        /* Centred on the first line's cap height rather than the line box, so the
           dot still lines up when a hint wraps to two lines. */
        top: 0.62em;
        width: 6px;
        height: 6px;
        background: var(--wfs-accent);
        border-radius: 50%;
      }

      /* The shortcut, as a key cap. The one thing in the hint list worth spotting
         without reading the sentence around it. */
      [data-wfs-help-combo] {
        padding: 2px 8px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        color: var(--wfs-text);
        background: var(--wfs-elevated);
        border: 1px solid var(--wfs-border);
        border-radius: 6px;
        /* Tabular figures so a combination containing a digit does not shift the
           line's width between renders. */
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      @media (max-width: 480px) {
        body {
          padding: 40px 18px 64px;
        }

        [data-wfs-welcome-title] {
          font-size: 27px;
        }

        .wfs-welcome__lead {
          font-size: 16px;
        }

        [data-wfs-welcome-pin] {
          padding: 20px 20px;
        }

        .wfs-welcome__pin-callout {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <!--
        The mark lives in the shell rather than being created in script: it is the
        one thing on the page that carries no copy, so it cannot drift, and having
        it paint with the document means the page is never briefly empty.

        `alt` is empty on purpose. The title immediately below names the product,
        so describing the icon would announce the name twice.
      -->
      <img class="wfs-welcome__mark" src="../icons/icon128.png" alt="" width="64" height="64" />

      <!-- Everything with words in it. Filled by §13; empty in the shell. -->
      <div id="welcome"></div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
