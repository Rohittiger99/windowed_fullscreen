# Gate for the extension: types, unit tests, and a build that actually produces
# a loadable extension.
#
# `npm run verify:live` is deliberately absent. It drives a real YouTube page over
# the DevTools protocol, so it needs a browser and a network and would fail for
# reasons that have nothing to do with the change under test. Run it locally
# before shipping anything that touches layout — see AGENTS.md.
name: CI

on:
  push:
    branches: ["**"]
    # Release tags, so the packaging guard below has something to fire on.
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windowed-fullscreen-extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.18+ runs the TypeScript test files directly via type stripping,
          # which is what keeps the test suite dependency-free.
          node-version: "24"
          cache: npm
          cache-dependency-path: windowed-fullscreen-extension/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Also asserts manifest.json and package.json carry the same version.
      - name: Build
        run: npm run build

      # Tags only, and that is the whole point of the condition.
      #
      # `npm run package` refuses any bundle containing the provider's test hosts,
      # and test mode is the correct state for the entire development phase — you
      # cannot work against live licence keys without buying the product to test it.
      # Running this per commit therefore made CI red on every commit that was not a
      # release, which is a check nobody reads.
      #
      # Nothing is lost by moving it. The guard exists to stop a test-mode build
      # reaching the store, the zip is the only thing that can be uploaded, and this
      # is the only step that writes one. `tests/entitlement.test.ts` still asserts
      # per commit that the API host and the checkout link are in the same mode.
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: unpacked-extension
          path: windowed-fullscreen-extension/extension
          if-no-files-found: error
