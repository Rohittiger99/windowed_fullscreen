<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="asset-size" content="1280x800" />
    <title>Windowed Fullscreen — native vs windowed</title>
    <link rel="stylesheet" href="./_base.css" />
    <style>
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 56px 0;
        text-align: center;
      }

      h1 {
        margin-top: 12px;
        font-size: 46px;
      }

      .sub {
        margin-top: 12px;
      }

      .columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 36px;
        width: 100%;
        margin-top: 30px;
        text-align: left;
      }

      .panel-label {
        justify-content: flex-start;
        margin-bottom: 12px;
      }

      .panel-label .pip {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }

      .is-native .panel-label {
        color: var(--secondary);
      }
      .is-native .pip {
        background: var(--muted);
      }
      .is-ours .panel-label {
        color: var(--accent);
      }
      .is-ours .pip {
        background: var(--accent);
      }

      .is-ours .shot {
        border-color: rgba(43, 143, 238, 0.55);
        box-shadow: 0 0 0 1px rgba(43, 143, 238, 0.3),
          0 26px 60px -20px rgba(0, 0, 0, 0.8);
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="eyebrow"><span class="dot"></span>Same video, two modes</div>
      <h1>One of these hides your computer.</h1>
      <p class="sub">Big video, without taking over your screen.</p>

      <div class="columns">
        <!-- Native fullscreen: the same frame with the browser and OS chrome gone. -->
        <section class="is-native">
          <div class="panel-label"><span class="pip"></span>NATIVE FULLSCREEN</div>
          <div
            class="shot framed"
            style="--w: 552px; --cx: 0.078; --cy: 0.099; --cw: 0.845; --ch: 0.847"
          >
            <img src="../raw/after-windowed.png" alt="" />
          </div>
          <div class="list">
            <div class="check off">
              <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
                <circle cx="10" cy="10" r="9" fill="rgba(255,255,255,0.06)" />
                <path
                  d="M7 7l6 6M13 7l-6 6"
                  fill="none"
                  stroke="#6f6a64"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
              <span>Tabs gone</span>
            </div>
            <div class="check off">
              <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
                <circle cx="10" cy="10" r="9" fill="rgba(255,255,255,0.06)" />
                <path
                  d="M7 7l6 6M13 7l-6 6"
                  fill="none"
                  stroke="#6f6a64"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
              <span>Taskbar and clock gone</span>
            </div>
          </div>
        </section>

        <!-- Windowed fullscreen: the capture exactly as taken. -->
        <section class="is-ours">
          <div class="panel-label"><span class="pip"></span>WINDOWED FULLSCREEN</div>
          <div class="shot framed" style="--w: 552px">
            <img src="../raw/after-windowed.png" alt="" />
          </div>
          <div class="list">
            <div class="check">
              <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
                <circle cx="10" cy="10" r="9" fill="rgba(76,193,106,0.16)" />
                <path
                  d="M5.6 10.3l2.9 2.9L14.4 7.3"
                  fill="none"
                  stroke="#4cc16a"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span>Tabs stay</span>
            </div>
            <div class="check">
              <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
                <circle cx="10" cy="10" r="9" fill="rgba(76,193,106,0.16)" />
                <path
                  d="M5.6 10.3l2.9 2.9L14.4 7.3"
                  fill="none"
                  stroke="#4cc16a"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span>Taskbar and clock stay</span>
            </div>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
